name: Build iOS Tweak DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 Theos 环境
        uses: theos/theos-action@main

      - name: 编译插件
        run: |
          make clean
          make package

      - name: 上传 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: 编译出的插件deb
          path: ./packages/*.deb
