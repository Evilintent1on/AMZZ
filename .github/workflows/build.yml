name: Build DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 自动配置编译环境（你什么都不用做，GitHub会自己装）
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev ldid git
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 编译插件
        run: |
          make clean
          make package

      - name: 上传 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: 编译出的插件deb
          path: ./packages/*.deb
