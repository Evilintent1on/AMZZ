name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make

      # 终极地毯式覆盖，把所有文件塞进所有可能的文件夹，它要哪个就给哪个
      - name: 自动修正源码目录（终极覆盖）
        run: |
          mkdir -p Sources/Core Sources/Hooks Sources/UI Sources/ layout
          cp *.m *.h *.inc Sources/Core/ 2>/dev/null || true
          cp *.m *.h *.inc Sources/Hooks/ 2>/dev/null || true
          cp *.m *.h *.inc Sources/UI/ 2>/dev/null || true
          cp *.m *.h *.inc Sources/ 2>/dev/null || true
          cp *.plist layout/ 2>/dev/null || true

      - name: 自动修正 Makefile 中的 SDK 版本
        run: |
          sed -i '' 's/16.5/latest/g' Makefile || true
          sed -i '' 's/iPhoneOS16.5/iPhoneOS17.0/g' Makefile || true

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: awzz-deb
          path: packages/*.deb
