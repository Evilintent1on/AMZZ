name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make

      # 终极绝招：直接修改 Makefile，把里面的 Sources/xxx/ 路径前缀全删掉，让它去根目录找文件
      - name: 终极修改 Makefile 路径（一劳永逸）
        run: |
          sed -i '' 's|Sources/Core/||g' Makefile
          sed -i '' 's|Sources/Hooks/||g' Makefile
          sed -i '' 's|Sources/UI/||g' Makefile
          sed -i '' 's|Sources/Settings/||g' Makefile
          sed -i '' 's|Sources/||g' Makefile

      - name: 自动修正 Makefile 中的 SDK 版本
        run: |
          sed -i '' 's/16.5/latest/g' Makefile || true
          sed -i '' 's/iPhoneOS16.5/iPhoneOS17.0/g' Makefile || true

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: awzz-deb
          path: packages/*.deb
