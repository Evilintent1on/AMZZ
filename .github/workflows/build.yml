name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make

      # 关键补充：自动整理目录结构，解决找不到源码文件的问题
      - name: 自动修正源码目录
        run: |
          mkdir -p Sources/Hooks layout
          cp *.m *.h *.inc Sources/Hooks/ 2>/dev/null || true
          cp *.plist layout/ 2>/dev/null || true

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: amzz-deb
          path: packages/*.deb
